[project]
name = "campaign-platform-backend"
version = "1.0.0"
description = "Self-hosted Omnichannel Campaign Management Platform — backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
