version: "3.9"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapipeline
    env_file:
      - .env
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config
      # Mount credentials for Google Drive / SharePoint (optional)
      - ./config/gdrive_credentials.json:/app/config/gdrive_credentials.json:ro
    ports:
      - "8000:8000"   # Prometheus metrics
    command: run --input /app/input
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "-c", "import src; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pipeline-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - pipeline
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.3
    container_name: pipeline-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  grafana_data:
