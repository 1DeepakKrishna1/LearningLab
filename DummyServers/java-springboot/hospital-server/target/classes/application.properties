# Configurable port. Override with: --server.port=9090  OR  env SERVER_PORT=9090
server.port=${SERVER_PORT:8082}

spring.application.name=hospital-server

# Swagger / OpenAPI paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Authentication ---
# Set to false to run the API completely open (no API key / JWT required)
auth.enabled=${AUTH_ENABLED:true}
# API Key clients send in the "X-API-Key" header
auth.api-key=${API_KEY:my-secret-api-key}
# Secret used to sign/verify JWTs (must be >= 32 chars for HS256)
auth.jwt-secret=${JWT_SECRET:my-super-secret-jwt-key-change-me-please-32+chars}
auth.jwt-exp-seconds=${JWT_EXP_SECONDS:3600}
# Demo credentials accepted by POST /auth/login
auth.user=${AUTH_USER:admin}
auth.pass=${AUTH_PASS:password}
