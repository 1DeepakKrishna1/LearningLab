services:
  db:
    image: mysql:8.0
    container_name: ialloc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ialloc
      MYSQL_USER: ialloc
      MYSQL_PASSWORD: ialloc
    ports:
      - "3306:3306"
    volumes:
      - ialloc_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ialloc_db:
