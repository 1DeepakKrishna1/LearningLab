[project]
name = "clawflow-backend"
version = "0.1.0"
description = "ClawFlow — Agentic Workflow Automation Platform (backend) powered by OpenClaw"
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
